openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: linkedin
    description: Public LinkedIn guest job-search operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /linkedin/jobs:
    get:
      operationId: searchLinkedInGuestJobs
      tags: [linkedin]
      summary: Search recent LinkedIn guest job postings
      description: |
        Fetches one page from LinkedIn's public guest job-search endpoint,
        extracts relative posting labels, estimates UTC posting timestamps from
        the scrape time, and sorts results newest first. The date-only datetime
        attribute is returned for reference but is never used to calculate time.
        Optional experience levels are extracted from public job detail pages.
      parameters:
        - name: keywords
          in: query
          required: true
          description: Job title, skill, or search phrase.
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: location
          in: query
          required: false
          description: Optional location filter.
          schema:
            type: string
            maxLength: 120
        - name: freshnessHours
          in: query
          required: false
          description: LinkedIn posting window, mapped to its public time filter.
          schema:
            type: integer
            enum: [1, 2, 6, 12, 24]
            default: 24
        - name: experienceLevel
          in: query
          required: false
          description: Optional seniority level to extract from each public job detail page.
          schema:
            $ref: "#/components/schemas/ExperienceLevel"
        - name: start
          in: query
          required: false
          description: LinkedIn page offset. Each page is limited by LinkedIn.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 0
      responses:
        "200":
          description: Jobs with parseable relative posting times, newest first.
          headers:
            X-LinkedIn-Scraped-At:
              description: UTC timestamp used as the anchor for estimated posting times.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedInGuestJob"
        "400":
          description: Invalid search parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: LinkedIn returned an error or an unexpected response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: LinkedIn did not respond before the request timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LinkedInGuestJob:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        title:
          type: string
        company:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        rawRelative:
          type: string
        rawDateOnly:
          type: ["string", "null"]
        relativeAgeMs:
          type: integer
          minimum: 0
          description: Age duration parsed from LinkedIn's relative label at scrape time; suitable for freshness-window filtering.
        computedPostTime:
          type: string
          format: date-time
          description: Estimated UTC time derived from the displayed relative label and scrape time.
        timestampIsEstimate:
          type: boolean
          const: true
        timePrecision:
          type: string
          enum: [second, minute, hour, day]
        verifiedUrl:
          type: string
          format: uri
        experienceLevel:
          type: ["string", "null"]
          enum: [internship, entry_level, associate, mid_senior, director, executive, not_applicable, null]
          description: Seniority level listed on the LinkedIn job detail page; null when not available.
        experienceLevelStatus:
          type: string
          enum: [not_requested, available, not_listed, unavailable]
          description: Whether seniority was requested and whether LinkedIn exposed a level.
      required:
        - id
        - title
        - company
        - location
        - rawRelative
        - rawDateOnly
        - relativeAgeMs
        - computedPostTime
        - timestampIsEstimate
        - timePrecision
        - verifiedUrl
        - experienceLevel
        - experienceLevelStatus
    ExperienceLevel:
      type: string
      enum: [internship, entry_level, associate, mid_senior, director, executive, not_applicable]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

